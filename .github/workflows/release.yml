name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: release-spark-${{ matrix.spark }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: spark35
            java: "11"
          - profile: spark40
            java: "17"
    steps:
      - name: Checkout source code at commit ${{ github.sha }}
        id: checkout-source-code
        uses: actions/checkout@v7

      - name: Set version from tag
        id: set-version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          mvn -B -P${{ matrix.profile }} versions:set -DnewVersion="$TAG" -DgenerateBackupPoms=false

      - name: Set up JDK ${{ matrix.java }}
        id: setup-java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish to Maven Central
        id: publish-to-maven-central
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -P${{ matrix.profile }},release -DskipTests deploy
