name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: release-spark-${{ matrix.profile }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: spark35
            spark: "3.5"
            java: "11"
          - profile: spark41
            spark: "4.1"
            java: "17"
    steps:
      - name: Checkout source code at commit ${{ github.sha }}
        id: checkout-source-code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        id: setup-java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          mvn-server-credentials: |
            central:MAVEN_USERNAME:MAVEN_PASSWORD
            github:GITHUB_ACTOR:GITHUB_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set version from tag
        id: set-version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          mvn -B -P${{ matrix.profile }} versions:set -DnewVersion="$TAG" -DgenerateBackupPoms=false

      - name: Build thin/fat JARs for GitHub Release
        id: build-jar-packages
        run: mvn -B -P${{ matrix.profile }} -DskipTests package

      - name: Upload fat JAR artifacts
        id: upload-workflow-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spark-packages-${{ matrix.spark }}
          path: target/*-all.jar
          if-no-files-found: error
          overwrite: true

      - name: Publish to Maven Central
        id: publish-to-maven-central
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -P${{ matrix.profile }},release -DskipTests deploy

      - name: Publish to GitHub Packages
        id: publish-to-github-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -P${{ matrix.profile }},github-packages -DskipTests deploy

  github-release:
    name: github-release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source code at commit ${{ github.sha }}
        id: checkout-source-code
        uses: actions/checkout@v7

      - name: Download fat JARs
        id: download-fat-jars
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: spark-packages-*
          merge-multiple: true

      - name: Upload fat JARs to GitHub Release
        id: upload-release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*-all.jar --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" dist/*-all.jar \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --generate-notes \
              --verify-tag
          fi
