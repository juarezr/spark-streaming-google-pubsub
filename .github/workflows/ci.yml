name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: test-spark-${{ matrix.spark }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: "3.5"
            profile: spark35
            java: "11"
          - spark: "4.0"
            profile: spark40
            java: "17"
          - spark: "4.1"
            profile: spark41
            java: "21"
          - spark: "4.2"
            profile: spark42
            java: "21"
    steps:
      - name: Checkout source code at commit ${{ github.sha }}
        id: checkout-source-code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        id: setup-java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Unit tests
        id: unit-tests
        run: mvn -B -P${{ matrix.profile }} -Dspotless.check.skip=true test

      - name: Start Pub/Sub emulator
        id: start-pubsub-emulator
        run: |
          docker run -d --name pubsub-emulator -p 8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/8085) >/dev/null 2>&1; then
              echo "Emulator is up"
              exit 0
            fi
            sleep 2
          done
          echo "Emulator failed to start"
          docker logs pubsub-emulator || true
          exit 1

      - name: Integration tests + package
        id: integration-tests-package
        env:
          PUBSUB_EMULATOR_HOST: localhost:8085
        run: mvn -B -P${{ matrix.profile }} -Dspotless.check.skip=true verify

      - name: Spotless Source Code Check
        id: spotless-check
        run: mvn -B -P${{ matrix.profile }} spotless:check

      - name: Upload artifacts
        id: upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: jars-spark-${{ matrix.spark }}
          path: target/*.jar
          if-no-files-found: error
